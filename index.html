<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14181d">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Entreno">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<title>Entreno</title>
<style>
:root{
  --base:#14181d;      /* suelo de gimnasio */
  --panel:#1d232b;
  --panel-2:#262e38;
  --line:#323c48;
  --ink:#eef2f6;
  --ink-dim:#93a1b0;
  --plate:#2f6fd0;     /* azul disco 20 kg */
  --plate-hi:#f2c23e;  /* amarillo disco 15 kg */
  --danger:#c8503f;
  --ok:#4f9d69;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--base);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.45;
  padding-bottom:84px;
  -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit;color:inherit}
input,textarea,select{
  background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
  padding:10px 12px;width:100%;
}
input:focus,textarea:focus,select:focus,button:focus-visible{
  outline:2px solid var(--plate-hi);outline-offset:2px;
}
.num{font-variant-numeric:tabular-nums}

/* ---- cabecera ---- */
header{
  position:sticky;top:0;z-index:20;background:var(--base);
  border-bottom:1px solid var(--line);
  padding:14px 16px 10px;
}
header h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.02em;color:var(--ink-dim)}
#hdrDay{margin:2px 0 0;font-size:26px;font-weight:750;letter-spacing:-.02em;line-height:1.1}
#hdrSub{margin:2px 0 0;font-size:14px;color:var(--ink-dim)}

/* ---- contenido ---- */
main{padding:16px 16px 0;max-width:620px;margin:0 auto}
.view{display:none}
.view.on{display:block}

.card{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  margin-bottom:12px;overflow:hidden;
}
.ex{display:flex;align-items:stretch;width:100%;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.ex:active{background:var(--panel-2)}
.thumb{
  flex:0 0 78px;width:78px;background:var(--panel-2);
  display:flex;align-items:center;justify-content:center;
  border-right:1px solid var(--line);
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb span{font-size:11px;color:var(--ink-dim);text-align:center;padding:6px;line-height:1.25}
.exBody{flex:1;padding:11px 12px;min-width:0}
.exName{font-weight:650;font-size:16px}
.exTarget{font-size:14px;color:var(--ink-dim);margin-top:1px}
.exLast{font-size:14px;margin-top:5px;color:var(--plate-hi)}
.exLast.empty{color:var(--ink-dim)}

.dayNote{
  background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--plate);
  border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:15px;color:var(--ink-dim)
}
.dayNote b{color:var(--ink);font-weight:600}

h2.sec{font-size:14px;font-weight:600;color:var(--ink-dim);margin:22px 0 8px}

.btn{
  display:block;width:100%;padding:14px;border:0;border-radius:10px;
  background:var(--plate);color:#fff;font-weight:650;cursor:pointer;
}
.btn:active{filter:brightness(.9)}
.btn.ghost{background:var(--panel-2);border:1px solid var(--line);color:var(--ink)}
.btn.warn{background:var(--danger)}
.btn.row{margin-bottom:10px}

/* ---- navegación inferior ---- */
nav{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  display:flex;background:var(--panel);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1;background:none;border:0;padding:11px 4px 13px;
  color:var(--ink-dim);font-size:13px;font-weight:600;cursor:pointer;
  border-top:3px solid transparent;
}
nav button.on{color:var(--ink);border-top-color:var(--plate-hi)}

/* ---- hoja modal ---- */
.sheet{
  position:fixed;inset:0;z-index:40;background:rgba(6,8,11,.72);
  display:none;align-items:flex-end;
}
.sheet.on{display:flex}
.sheetBox{
  background:var(--base);width:100%;max-height:92vh;overflow-y:auto;
  border-radius:16px 16px 0 0;border-top:1px solid var(--line);
  padding:18px 16px calc(24px + env(safe-area-inset-bottom));
  max-width:620px;margin:0 auto;
}
.sheetBox h3{margin:0 0 2px;font-size:21px;font-weight:700;letter-spacing:-.01em}
.sheetBox .sub{color:var(--ink-dim);font-size:14px;margin-bottom:16px}

.ref{width:100%;padding:4px}
.ref svg{width:100%;height:auto;display:block}
.frames{display:flex;gap:8px;align-items:flex-end}
.frames figure{flex:1;margin:0;min-width:0}
.frames svg{width:100%;height:auto;display:block}
.frames figcaption{font-size:12px;color:var(--ink-dim);text-align:center;margin-top:2px}
.ref svg{width:100%;height:auto;display:block}
.refBox{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:10px 14px;margin-bottom:14px;
}
.refBox{padding:12px 10px 8px}
.refBox .frames{max-width:460px;margin:0 auto}

/* ---- series ---- */
.setRow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.setRow .n{flex:0 0 26px;color:var(--ink-dim);font-size:14px;font-weight:600}
.setRow .f{flex:1;position:relative}
.setRow .f label{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  font-size:13px;color:var(--ink-dim);pointer-events:none
}
.setRow input{padding-right:42px;text-align:center}
.setRow .del{
  flex:0 0 40px;padding:10px 0;background:none;border:1px solid var(--line);
  border-radius:8px;color:var(--ink-dim);cursor:pointer
}

.hist{border-top:1px solid var(--line);padding:9px 0;font-size:15px;display:flex;gap:10px}
.hist .d{flex:0 0 78px;color:var(--ink-dim);font-size:14px}
.hist .v{flex:1}

.empty{color:var(--ink-dim);padding:22px 4px;text-align:center;font-size:15px}
.warnbar{background:var(--danger);color:#fff;padding:10px 16px;font-size:14px}
.hide{display:none}
.field{margin-bottom:12px}
.field span{display:block;font-size:14px;color:var(--ink-dim);margin-bottom:5px}
.two{display:flex;gap:8px}
.two>*{flex:1}
@media (prefers-reduced-motion:no-preference){
  .sheet.on .sheetBox{animation:up .2s ease-out}
  @keyframes up{from{transform:translateY(14px)}to{transform:none}}
}
</style>
</head>
<body>

<div id="warn" class="warnbar hide"></div>

<header>
  <h1 id="hdrTitle">Hoy</h1>
  <p id="hdrDay">—</p>
  <p id="hdrSub"></p>
</header>

<main>
  <section id="v-hoy" class="view on"></section>
  <section id="v-plan" class="view"></section>
  <section id="v-hist" class="view"></section>
  <section id="v-set" class="view"></section>
</main>

<nav>
  <button data-v="hoy" class="on">Hoy</button>
  <button data-v="plan">Plan</button>
  <button data-v="hist">Historial</button>
  <button data-v="set">Ajustes</button>
</nav>

<div id="sheet" class="sheet"><div class="sheetBox" id="sheetBox"></div></div>

/* ---------------- estado y persistencia ---------------- */
var state = null, storeOK = true, view = "hoy", openEx = null, draft = null;

function migrate(s){
  if(!s || typeof s !== "object") return null;
  if(!Array.isArray(s.days)) return null;
  if(!Array.isArray(s.logs)) s.logs = [];
  s.days.forEach(function(d){
    if(!Array.isArray(d.ex)) d.ex = [];
    if(!Array.isArray(d.wd)) d.wd = [];
    d.ex.forEach(function(e){
      if(typeof e.note !== "string") e.note = "";
      if(typeof e.ref !== "string") e.ref = "";
      if(typeof e.find !== "string") e.find = "";
      if(!e.t) e.t = "f";
      if(typeof e.sets !== "number" || e.sets < 1) e.sets = 3;
      if(typeof e.reps !== "string") e.reps = String(e.reps == null ? "" : e.reps);
    });
  });
  return s;
}

function load(){
  var raw = null;
  try{ raw = localStorage.getItem(KEY); }
  catch(err){ storeOK = false; }
  if(!raw) return seed();
  try{
    var s = migrate(JSON.parse(raw));
    return s || seed();
  }catch(err){ return seed(); }
}

function save(){
  if(!storeOK) return false;
  try{
    localStorage.setItem(KEY, JSON.stringify(state));
    return true;
  }catch(err){
    storeOK = false;
    showWarn("No se ha podido guardar: el almacenamiento del navegador esta lleno o bloqueado. Exporta una copia en Ajustes.");
    return false;
  }
}

function showWarn(msg){
  var w = document.getElementById("warn");
  if(!w) return;
  w.textContent = msg;
  w.classList.remove("hide");
}

/* ---------------- utilidades ---------------- */
function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function today(){ return new Date(); }
function ymd(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function fmtDate(s){
  var p = String(s).split("-");
  if(p.length !== 3) return s;
  return p[2] + "/" + p[1];
}
function findEx(id){
  for(var i=0;i<state.days.length;i++){
    var ex = state.days[i].ex;
    for(var j=0;j<ex.length;j++) if(ex[j].id === id) return {ex:ex[j], day:state.days[i], i:j};
  }
  return null;
}
function dayForDate(d){
  var wd = d.getDay();
  for(var i=0;i<state.days.length;i++) if(state.days[i].wd.indexOf(wd) !== -1) return state.days[i];
  return null;
}
var DIAS = ["domingo","lunes","martes","miercoles","jueves","viernes","sabado"];

function logsOf(exId){
  return state.logs.filter(function(l){ return l.exId === exId; })
    .sort(function(a,b){ return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
}
function setsText(l){
  if(l.cardio) {
    var bits = [];
    if(l.cardio.min) bits.push(l.cardio.min + " min");
    if(l.cardio.inc) bits.push(l.cardio.inc + "%");
    if(l.cardio.kmh) bits.push(l.cardio.kmh + " km/h");
    return bits.join(" · ") || "sesion hecha";
  }
  return (l.sets||[]).map(function(s){
    var kg = (s.kg === "" || s.kg == null) ? "—" : s.kg + " kg";
    return kg + " × " + (s.reps === "" || s.reps == null ? "—" : s.reps);
  }).join("  ");
}


/* ---------------- render ---------------- */
function render(){
  ["hoy","plan","hist","set"].forEach(function(v){
    document.getElementById("v-"+v).classList.toggle("on", v === view);
  });
  Array.prototype.forEach.call(document.querySelectorAll("nav button"), function(b){
    b.classList.toggle("on", b.dataset.v === view);
  });
  if(view === "hoy") renderHoy();
  if(view === "plan") renderPlan();
  if(view === "hist") renderHist();
  if(view === "set") renderSet();
}

function head(title, big, sub){
  document.getElementById("hdrTitle").textContent = title;
  document.getElementById("hdrDay").textContent = big;
  document.getElementById("hdrSub").textContent = sub || "";
}

function exCard(e){
  var last = logsOf(e.id)[0];
  var ph = (e.ref && REF[e.ref])
    ? '<div class="ref">'+REF[e.ref].t+'</div>'
    : '<span>Sin dibujo</span>';
  var lastTxt = last
    ? '<div class="exLast num">'+esc(fmtDate(last.date))+' · '+esc(setsText(last))+'</div>'
    : '<div class="exLast empty">Sin registros</div>';
  return '<div class="card"><button class="ex" data-ex="'+esc(e.id)+'">'
    + '<div class="thumb">'+ph+'</div>'
    + '<div class="exBody"><div class="exName">'+esc(e.name)+'</div>'
    + '<div class="exTarget num">'+(e.t==="c" ? esc(e.reps) : esc(e.sets)+' × '+esc(e.reps))+'</div>'
    + lastTxt + '</div></button></div>';
}

function renderHoy(){
  var d = today(), day = dayForDate(d);
  var nombre = DIAS[d.getDay()];
  var el = document.getElementById("v-hoy");
  if(!day){
    head("Hoy", "Descanso", nombre.charAt(0).toUpperCase()+nombre.slice(1)+" · sin sesion asignada");
    el.innerHTML = '<div class="empty">Hoy toca descansar. Si quieres entrenar de todas formas, elige la sesion en Plan.</div>';
    return;
  }
  head("Hoy", day.name, nombre.charAt(0).toUpperCase()+nombre.slice(1));
  el.innerHTML = (day.note ? '<div class="dayNote">'+esc(day.note)+'</div>' : '')
    + (day.ex.length ? day.ex.map(exCard).join("") : '<div class="empty">Esta sesion no tiene ejercicios. Anadelos desde Plan.</div>');
}

function renderPlan(){
  head("Plan", "Semana", "Toca un ejercicio para ver o registrar");
  var el = document.getElementById("v-plan");
  el.innerHTML = state.days.map(function(day){
    return '<h2 class="sec">'+esc(day.name)+' · '+ (day.wd.length ? day.wd.map(function(w){return DIAS[w];}).join(", ") : "sin dia") +'</h2>'
      + (day.ex.length ? day.ex.map(exCard).join("") : '<div class="empty">Sin ejercicios</div>')
      + '<button class="btn ghost row" data-add="'+esc(day.id)+'">Anadir ejercicio a '+esc(day.name)+'</button>';
  }).join("");
}

function renderHist(){
  head("Historial", "Registros", state.logs.length + " sesiones guardadas");
  var el = document.getElementById("v-hist");
  if(!state.logs.length){
    el.innerHTML = '<div class="empty">Aun no has registrado nada. Empieza en Hoy: toca un ejercicio y guarda las series.</div>';
    return;
  }
  var byDate = {};
  state.logs.forEach(function(l){ (byDate[l.date] = byDate[l.date] || []).push(l); });
  var dates = Object.keys(byDate).sort().reverse();
  el.innerHTML = dates.map(function(dt){
    return '<h2 class="sec num">'+esc(dt)+'</h2><div class="card" style="padding:4px 12px 8px">'
      + byDate[dt].map(function(l){
          var f = findEx(l.exId);
          return '<div class="hist"><div class="d">'+esc(f ? f.ex.name.split(" ")[0] : "—")+'</div>'
            + '<div class="v"><div>'+esc(f ? f.ex.name : "Ejercicio borrado")+'</div>'
            + '<div class="num" style="color:var(--plate-hi);font-size:14px">'+esc(setsText(l))+'</div></div></div>';
        }).join("")
      + '</div>';
  }).join("");
}

function renderSet(){
  head("Ajustes", "Copia y datos", "Los datos se guardan solo en este movil");
  var n = 0;
  state.days.forEach(function(d){ n += d.ex.length; });
  document.getElementById("v-set").innerHTML =
     '<div class="dayNote"><b>'+n+' ejercicios</b> y <b>'+state.logs.length+' sesiones</b> guardadas. '
   + 'Nada sale de este telefono: si borras los datos del navegador o cambias de movil, se pierde. Exporta de vez en cuando.</div>'
   + '<button class="btn row" data-act="export">Exportar copia de seguridad</button>'
   + '<label class="btn ghost row" style="text-align:center;cursor:pointer">Importar copia<input type="file" accept=".json,application/json" id="impFile" style="display:none"></label>'
   + '<button class="btn warn row" data-act="reset">Restaurar el plan original</button>'
   + '<div class="empty">Restaurar borra tus ejercicios y registros y vuelve al plan inicial.</div>'
  
}

/* ---------------- hoja de ejercicio ---------------- */
function openSheet(html){
  document.getElementById("sheetBox").innerHTML = html;
  document.getElementById("sheet").classList.add("on");
}
function closeSheet(){
  document.getElementById("sheet").classList.remove("on");
  openEx = null; draft = null;
}

function sheetEx(id){
  var f = findEx(id);
  if(!f) return;
  openEx = id;
  var e = f.ex, last = logsOf(id)[0];
  if(!draft){
    if(e.t === "c"){
      draft = {cardio:{min:last&&last.cardio?last.cardio.min:"", inc:last&&last.cardio?last.cardio.inc:"", kmh:last&&last.cardio?last.cardio.kmh:""}};
    }else{
      var rows = [];
      for(var i=0;i<e.sets;i++){
        var prev = last && last.sets && last.sets[i];
        rows.push({kg: prev?prev.kg:"", reps: prev?prev.reps:""});
      }
      draft = {sets:rows};
    }
  }
  var body = '<h3>'+esc(e.name)+'</h3>'
    + '<div class="sub num">'+(e.t==="c" ? esc(e.reps) : esc(e.sets)+' series × '+esc(e.reps)+' repeticiones')+'</div>';

  if(e.ref && REF[e.ref]) body += '<div class="refBox">'+REF[e.ref].a+'</div>';
  if(e.find) body += '<div class="dayNote"><b>Que buscar en el gimnasio:</b> '+esc(e.find)+'</div>';
  if(e.note) body += '<div class="dayNote"><b>Tecnica:</b> '+esc(e.note)+'</div>';

  body += '<h2 class="sec">Registrar sesion de hoy</h2>';
  if(e.t === "c"){
    body += '<div class="two">'
      + '<div class="field"><span>Minutos</span><input id="c_min" type="number" inputmode="numeric" min="0" value="'+esc(draft.cardio.min)+'"></div>'
      + '<div class="field"><span>Desnivel %</span><input id="c_inc" type="number" inputmode="decimal" step="0.5" min="0" value="'+esc(draft.cardio.inc)+'"></div>'
      + '<div class="field"><span>km/h</span><input id="c_kmh" type="number" inputmode="decimal" step="0.1" min="0" value="'+esc(draft.cardio.kmh)+'"></div>'
      + '</div>';
  }else{
    body += draft.sets.map(function(s,i){
      return '<div class="setRow"><div class="n num">'+(i+1)+'</div>'
        + '<div class="f"><input data-k="kg" data-i="'+i+'" type="number" inputmode="decimal" step="0.5" min="0" value="'+esc(s.kg)+'"><label>kg</label></div>'
        + '<div class="f"><input data-k="reps" data-i="'+i+'" type="number" inputmode="numeric" min="0" value="'+esc(s.reps)+'"><label>reps</label></div>'
        + '<button class="del" data-delset="'+i+'" aria-label="Quitar serie '+(i+1)+'">×</button></div>';
    }).join("")
    + '<button class="btn ghost row" data-act="addset">Anadir serie</button>';
  }
  body += '<button class="btn row" data-act="savelog">Guardar sesion</button>'
    + '<button class="btn ghost row" data-act="editex">Editar este ejercicio</button>'
    + '<button class="btn warn row" data-act="delex">Borrar ejercicio</button>'
    + '<button class="btn ghost" data-act="close">Cerrar</button>';

  var h = logsOf(id);
  if(h.length){
    body += '<h2 class="sec">Historial de este ejercicio</h2><div class="card" style="padding:2px 12px 8px">'
      + h.slice(0,12).map(function(l){
          return '<div class="hist"><div class="d num">'+esc(fmtDate(l.date))+'</div><div class="v num">'+esc(setsText(l))+'</div></div>';
        }).join("") + '</div>';
  }
  openSheet(body);
}

function sheetEditEx(id, dayId){
  var f = id ? findEx(id) : null;
  var e = f ? f.ex : {name:"", sets:3, reps:"10", note:"", t:"f"};
  openSheet('<h3>'+(f ? "Editar ejercicio" : "Nuevo ejercicio")+'</h3><div class="sub">Los cambios se guardan en este movil.</div>'
    + '<div class="field"><span>Nombre</span><input id="f_name" value="'+esc(e.name)+'" placeholder="Ej. Prensa de piernas"></div>'
    + '<div class="field"><span>Tipo</span><select id="f_type">'
    +   '<option value="f"'+(e.t==="f"?" selected":"")+'>Fuerza (series y kilos)</option>'
    +   '<option value="c"'+(e.t==="c"?" selected":"")+'>Cardio (minutos y desnivel)</option>'
    + '</select></div>'
    + '<div class="two"><div class="field"><span>Series</span><input id="f_sets" type="number" inputmode="numeric" min="1" max="12" value="'+esc(e.sets)+'"></div>'
    + '<div class="field"><span>Repeticiones</span><input id="f_reps" value="'+esc(e.reps)+'" placeholder="12"></div></div>'
    + '<div class="field"><span>Notas de tecnica</span><textarea id="f_note" rows="3">'+esc(e.note)+'</textarea></div>'
    + '<button class="btn row" data-act="saveex" data-id="'+esc(id||"")+'" data-day="'+esc(dayId||"")+'">Guardar ejercicio</button>'
    + '<button class="btn ghost" data-act="close">Cancelar</button>');
}

/* ---------------- acciones ---------------- */
function addExercise(dayId, ex){
  var day = null;
  for(var i=0;i<state.days.length;i++) if(state.days[i].id === dayId) day = state.days[i];
  if(!day) return null;
  var e = {
    id: uid("e"), t: ex.t === "c" ? "c" : "f",
    name: String(ex.name||"").trim() || "Ejercicio sin nombre",
    sets: Math.min(12, Math.max(1, parseInt(ex.sets,10) || 3)),
    reps: String(ex.reps == null ? "" : ex.reps).trim() || "10",
    note: String(ex.note||"")
  };
  day.ex.push(e);
  save();
  return e;
}

function updateExercise(id, ex){
  var f = findEx(id);
  if(!f) return null;
  f.ex.t = ex.t === "c" ? "c" : "f";
  f.ex.name = String(ex.name||"").trim() || f.ex.name;
  f.ex.sets = Math.min(12, Math.max(1, parseInt(ex.sets,10) || f.ex.sets));
  f.ex.reps = String(ex.reps == null ? "" : ex.reps).trim() || f.ex.reps;
  f.ex.note = String(ex.note||"");
  save();
  return f.ex;
}

function removeExercise(id){
  var f = findEx(id);
  if(!f) return false;
  f.day.ex.splice(f.i,1);
  state.logs = state.logs.filter(function(l){ return l.exId !== id; });
  save();
  return true;
}

function logSession(exId, data, dateStr){
  var f = findEx(exId);
  if(!f) return null;
  var date = dateStr || ymd(today());
  var entry = {id: uid("l"), exId: exId, date: date};
  if(f.ex.t === "c"){
    var c = data.cardio || {};
    var min = c.min === "" || c.min == null ? "" : Number(c.min);
    var inc = c.inc === "" || c.inc == null ? "" : Number(c.inc);
    var kmh = c.kmh === "" || c.kmh == null ? "" : Number(c.kmh);
    if(min === "" && inc === "" && kmh === "") return null;
    entry.cardio = {min:min, inc:inc, kmh:kmh};
  }else{
    var sets = (data.sets||[]).map(function(s){
      return {
        kg: s.kg === "" || s.kg == null ? "" : Number(s.kg),
        reps: s.reps === "" || s.reps == null ? "" : Number(s.reps)
      };
    }).filter(function(s){ return s.kg !== "" || s.reps !== ""; });
    if(!sets.length) return null;
    entry.sets = sets;
  }
  // una entrada por ejercicio y dia: la nueva sustituye a la anterior
  state.logs = state.logs.filter(function(l){ return !(l.exId === exId && l.date === date); });
  state.logs.push(entry);
  save();
  return entry;
}

function exportJSON(){ return JSON.stringify(state); }

function importJSON(txt){
  var s;
  try{ s = JSON.parse(txt); }catch(err){ return false; }
  s = migrate(s);
  if(!s) return false;
  state = s;
  save();
  return true;
}

function download(){
  var blob = new Blob([exportJSON()], {type:"application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "entreno-" + ymd(today()) + ".json";
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 0);
}

/* ---------------- eventos ---------------- */
document.addEventListener("click", function(ev){
  var t = ev.target.closest ? ev.target.closest("[data-v],[data-ex],[data-add],[data-act],[data-delset]") : null;
  if(!t) return;

  if(t.dataset.v){ view = t.dataset.v; render(); return; }
  if(t.dataset.ex){ draft = null; sheetEx(t.dataset.ex); return; }
  if(t.dataset.add){ draft = null; sheetEditEx("", t.dataset.add); return; }
  if(t.dataset.delset !== undefined && t.dataset.delset !== ""){
    readDraft();
    draft.sets.splice(parseInt(t.dataset.delset,10),1);
    if(!draft.sets.length) draft.sets.push({kg:"",reps:""});
    sheetEx(openEx); return;
  }

  var act = t.dataset.act;
  if(act === "close"){ closeSheet(); render(); return; }
  if(act === "addset"){ readDraft(); draft.sets.push({kg:"",reps:""}); sheetEx(openEx); return; }
  if(act === "savelog"){
    readDraft();
    var r = logSession(openEx, draft);
    if(!r){ showWarn("Rellena al menos una serie o un dato antes de guardar."); return; }
    document.getElementById("warn").classList.add("hide");
    closeSheet(); render(); return;
  }
  if(act === "editex"){ sheetEditEx(openEx, ""); return; }
  if(act === "delex"){
    var f1 = findEx(openEx);
    if(f1 && confirm('Borrar "'+f1.ex.name+'" y sus registros?')){
      removeExercise(openEx); closeSheet(); render();
    }
    return;
  }
  if(act === "saveex"){
    var data = {
      name: (document.getElementById("f_name")||{}).value,
      t: (document.getElementById("f_type")||{}).value,
      sets: (document.getElementById("f_sets")||{}).value,
      reps: (document.getElementById("f_reps")||{}).value,
      note: (document.getElementById("f_note")||{}).value
    };
    if(!String(data.name||"").trim()){ showWarn("Ponle un nombre al ejercicio."); return; }
    document.getElementById("warn").classList.add("hide");
    if(t.dataset.id) updateExercise(t.dataset.id, data);
    else addExercise(t.dataset.day, data);
    closeSheet(); render(); return;
  }
  if(act === "export"){ download(); return; }
  if(act === "reset"){
    if(confirm("Esto borra tus ejercicios y registros y vuelve al plan original. Continuar?")){
      state = seed(); save(); render();
    }
    return;
  }
});

function readDraft(){
  if(!draft) return;
  if(draft.sets){
    Array.prototype.forEach.call(document.querySelectorAll("#sheetBox input[data-k]"), function(inp){
      var i = parseInt(inp.dataset.i,10);
      if(draft.sets[i]) draft.sets[i][inp.dataset.k] = inp.value;
    });
  }else if(draft.cardio){
    ["min","inc","kmh"].forEach(function(k){
      var el = document.getElementById("c_"+k);
      if(el) draft.cardio[k] = el.value;
    });
  }
}

document.addEventListener("change", function(ev){
  var inp = ev.target;
  if(inp.id === "impFile" && inp.files && inp.files[0]){
    var fr = new FileReader();
    fr.onload = function(){
      if(importJSON(fr.result)){
        document.getElementById("warn").classList.add("hide");
        render();
      }else{
        showWarn("Ese fichero no es una copia valida de la app.");
      }
    };
    fr.readAsText(inp.files[0]);
  }
});

document.getElementById("sheet").addEventListener("click", function(ev){
  if(ev.target === this){ closeSheet(); render(); }
});

/* ---------------- arranque ---------------- */
state = load();
if(!storeOK) showWarn("Este navegador no permite guardar datos en modo fichero local. Abre la app desde el navegador normal (no en pestana privada) para que se guarden los registros.");
render();

window.APP = {
  REF:REF,
  get state(){ return state; },
  set state(s){ state = s; },
  seed:seed, save:save, load:load, migrate:migrate,
  addExercise:addExercise, updateExercise:updateExercise, removeExercise:removeExercise,
  logSession:logSession, logsOf:logsOf, setsText:setsText, findEx:findEx,
  exportJSON:exportJSON, importJSON:importJSON,
  dayForDate:dayForDate, ymd:ymd, fmtDate:fmtDate, esc:esc, render:render,
  setView:function(v){ view = v; render(); }
};

})();
</script>

  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").catch(function () {});
  });
}
